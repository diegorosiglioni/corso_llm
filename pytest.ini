[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not real and not browser"
markers =
    real: prove con LM Studio attivo (eseguire con: pytest -m real)
    browser: pagina del front-end in Edge o Chrome installati, con Playwright (eseguire con: pytest -m browser)
# Il client della CLI passa il timeout a ogni richiesta; il TestClient dell'app (usato al posto
# della rete) lo ignora e lo segnala: nei test non serve.
filterwarnings =
    ignore:You should not use the 'timeout' argument with the TestClient
