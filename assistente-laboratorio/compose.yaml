services:
  assistente:
    build: .
    env_file: .env
    environment:
      # Dal container LM Studio sull'host si raggiunge tramite host.docker.internal.
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
