# Nome fisso: immagini e volumi non dipendono dalla cartella in cui si trova la repository.
name: assistente-laboratorio

# docker compose up avvia i quattro servizi: frontend, backend, agent, postgres.
# La CLI (assistant) è nel profilo cli: docker compose run --rm assistant.
# Credenziali di PostgreSQL nel file .env (esempio in .env.example), escluso da Git.

services:
  # Pagina della chat: il browser la apre su http://127.0.0.1:8080 e chiama direttamente il back-end.
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile  # comando predefinito: python -m frontend
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: "8080"
      # Indirizzo del back-end visto dal browser; vuoto → http://127.0.0.1:8001.
      BACKEND_URL: ${BACKEND_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8080:8080"  # solo da questo computer
    depends_on:
      backend:
        condition: service_started  # la pagina funziona anche col back-end spento (lo segnala)

  # Back-end: chat e messaggi in PostgreSQL, domande inoltrate all'agente sulla rete interna.
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile  # comando predefinito: python -m backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:?Manca POSTGRES_PASSWORD nel file .env}@postgres:5432/${POSTGRES_DB:-assistente}
      AGENT_URL: http://agent:8000
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8001"
      # Origini della pagina ammesse (CORS); vuoto → http://127.0.0.1:8080 e http://localhost:8080.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8001:8001"  # la pagina nel browser lo chiama qui (OpenAPI su /docs)
    # Se esce (per esempio database non ancora pronto al primo avvio) Compose lo riavvia.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy  # avvio a database pronto
      agent:
        condition: service_started  # senza agente il back-end risponde con un errore a ogni invio

  # Servizio HTTP dell'agente: grafo, server MCP (sottoprocesso stdio) e note. Non pubblicato:
  # lo raggiungono solo back-end e CLI sulla rete di Compose (docker compose exec agent … per /status).
  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile  # comando predefinito: python -m assistant.service
    env_file: .env
    environment:
      # La password serve solo a postgres e backend: qui vuota, vince su quella del .env.
      POSTGRES_PASSWORD: ""
      # LM Studio sull'host; per un'altra porta o un altro host impostare LMSTUDIO_BASE_URL_DOCKER nel .env.
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL_DOCKER:-http://host.docker.internal:1234/v1}
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Sano quando /status risponde e il server MCP è raggiungibile, anche con LM Studio spento
      # (503 con mcp ok: il modello sta fuori dal container). Ogni controllo chiama tools/list, quindi
      # un server MCP morto viene riavviato dall'agente entro il controllo successivo.
      test: ["CMD", "python", "-c", "import httpx, sys; sys.exit(httpx.get('http://127.0.0.1:8000/status', timeout=10).json()['mcp']['status'] != 'ok')"]
      # Ogni 2 s durante l'avvio, poi ogni 30 s (ogni controllo scrive una riga nel log dell'agente).
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 15s
      retries: 3
    volumes:
      - notes-data:/app/data

  # PostgreSQL ufficiale: solo per il back-end, sulla rete interna (nessuna porta pubblicata).
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Manca POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: ${POSTGRES_DB:-assistente}
    healthcheck:
      # $$ : variabili lette nel container. Con -U e -d niente «role "root" does not exist» nel log.
      # Con -h 127.0.0.1 conta solo il server vero in TCP, non quello temporaneo
      # dell'inizializzazione (solo socket Unix): il back-end non parte troppo presto.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      # Dalla versione 18 i dati stanno in /var/lib/postgresql/<versione>/docker.
      - postgres-data:/var/lib/postgresql

  # CLI, client dell'agente: docker compose run --rm assistant (avvia anche agent). Profilo cli:
  # non parte con docker compose up.
  assistant:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: docker/agent.Dockerfile  # stessa immagine dell'agente, con la CLI come comando
    command: ["python", "-m", "assistant"]
    env_file: .env
    environment:
      AGENT_URL: http://agent:8000
      POSTGRES_PASSWORD: ""  # la password serve solo a postgres e backend
    depends_on:
      agent:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  notes-data: {}
  postgres-data: {}
