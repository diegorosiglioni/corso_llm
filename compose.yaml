# Nome fisso: immagine e volume non dipendono dalla cartella in cui si trova la repository.
name: assistente-laboratorio

services:
  assistant:
    build: .
    env_file: .env
    environment:
      # LM Studio sull'host; per un'altra porta o un altro host impostare LMSTUDIO_BASE_URL_DOCKER nel .env.
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL_DOCKER:-http://host.docker.internal:1234/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    volumes:
      - notes-data:/app/data

volumes:
  notes-data: {}
